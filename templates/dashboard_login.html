<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: #f5f7fb;
            color: #1f2937;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);

            border: 1px solid #e5e7eb;
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 71px;
            height: 56px;

            margin: 0 auto 16px;

            border-radius: 14px;

            background: #111827;
            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 24px;
            font-weight: 700;
        }

        .brand h1 {
            margin: 0;

            font-size: 24px;
            font-weight: 700;

            color: #111827;
        }

        .brand p {
            margin: 8px 0 0;

            font-size: 14px;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 600;

            color: #374151;
        }

        .form-group input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d1d5db;
            border-radius: 10px;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: #111827;

            box-shadow:
                0 0 0 3px rgba(17, 24, 39, 0.08);
        }

        .login-button {
            width: 100%;

            padding: 13px 16px;

            border: none;
            border-radius: 10px;

            background: #111827;
            color: #ffffff;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.1s;
        }

        .login-button:hover {
            background: #1f2937;
        }

        .login-button:active {
            transform: translateY(1px);
        }

        .error {
            margin-bottom: 20px;

            padding: 12px 14px;

            border-radius: 10px;

            background: #fef2f2;
            border: 1px solid #fecaca;

            color: #b91c1c;

            font-size: 14px;
        }

        .back-link {
            display: block;

            margin-top: 24px;

            text-align: center;

            color: #6b7280;

            font-size: 14px;
            text-decoration: none;
        }

        .back-link:hover {
            color: #111827;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 16px;
            }

            .login-card {
                padding: 30px 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="brand">

                <div class="brand-icon">
                    MYB
                </div>

                <h1>Newsletter Dashboard</h1>

                <p>
                    Administrator access
                </p>

            </div>


            {% if error %}

                <div class="error">
                    {{ error }}
                </div>

            {% endif %}


            <form
                method="POST"
                action="{{ url_for('dashboard_login') }}"
            >

                <div class="form-group">

                    <label for="token">
                        Admin Token
                    </label>

                    <input
                        type="password"
                        id="token"
                        name="token"
                        placeholder="Enter admin token"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Sign In
                </button>

            </form>


            <a
                href="{{ url_for('index') }}"
                class="back-link"
            >
                ← Back to Newsletter Library
            </a>

        </div>

    </div>

</body>
</html>
