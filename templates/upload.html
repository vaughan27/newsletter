{% extends "base.html" %}


{% block title %}
Upload Newsletter
{% endblock %}


{% block content %}

<section class="hero">

    <div class="container">

        <p class="eyebrow">
            Administration
        </p>

        <h1>
            Upload Newsletter
        </h1>

        <p class="hero-description">
            Add a PDF newsletter to the company archive.
        </p>

    </div>

</section>


<main class="container upload-container">

    <form
        method="POST"
        action="{{ url_for('upload') }}"
        enctype="multipart/form-data"
        class="upload-form"
    >


        <div class="form-group">

            <label for="pdf">
                Newsletter PDF
            </label>

            <input
                type="file"
                id="pdf"
                name="pdf"
                accept=".pdf,application/pdf"
                required
            >

            <small>
                Maximum file size: 50 MB
            </small>

        </div>


        <div class="form-group">

            <label for="title">
                Newsletter title
            </label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="August 2026 Newsletter"
                required
            >

        </div>


        <div class="form-group">

            <label for="publication_date">
                Publication date
            </label>

            <input
                type="date"
                id="publication_date"
                name="publication_date"
                required
            >

        </div>


        <div class="form-group">

            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                name="description"
                rows="4"
                placeholder="Brief description of this newsletter..."
            ></textarea>

        </div>


        <div
            id="uploadStatus"
            class="upload-status"
        ></div>


        <button
            type="submit"
            class="button"
        >
            Upload Newsletter
        </button>


    </form>

</main>

{% endblock %}


{% block scripts %}

<script
    src="{{ url_for(
        'static',
        filename='js/upload.js'
    ) }}"
></script>

{% endblock %}
